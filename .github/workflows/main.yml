name: Ruff Check and Format

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install Ruff
      run: pip install ruff

    - name: Run Ruff Check
      run: ruff check .

    - name: Run Ruff Format
      run: ruff format .
